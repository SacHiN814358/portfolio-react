<svg width="100%" viewBox="70 40 580 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="ab-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="ab-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="ab-grad-bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="ab-base-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="ab-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ab-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Blue Aura -->
  <circle cx="360" cy="290" r="230" fill="url(#ab-ambient-glow)" />

  <!-- Orbit Rings -->
  <circle cx="360" cy="290" r="195" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="3 6" opacity="0.35" />
  <circle cx="360" cy="290" r="145" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.3" />
  <circle cx="360" cy="290" r="105" fill="none" stroke="#60A5FA" stroke-width="0.8" opacity="0.25" />

  <!-- Left Code Bracket "<" -->
  <g transform="translate(145, 260)" opacity="0.95">
    <path d="M -16 -50 L -50 0 L -16 50" fill="none" stroke="url(#ab-grad-primary)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Right Code Bracket ">" -->
  <g transform="translate(575, 320)" opacity="0.95">
    <path d="M 16 -50 L 50 0 L 16 50" fill="none" stroke="url(#ab-grad-cyan)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Curved Circuit Streams -->
  <path d="M 165 220 C 240 160, 280 170, 335 225" fill="none" stroke="url(#ab-grad-primary)" stroke-width="1.8" opacity="0.6" stroke-dasharray="2 6" stroke-linecap="round" />
  <path d="M 390 375 C 455 425, 490 415, 545 365" fill="none" stroke="url(#ab-grad-cyan)" stroke-width="1.8" opacity="0.6" stroke-dasharray="2 6" stroke-linecap="round" />

  <!-- Central Lightbulb & Creative Core -->
  <g transform="translate(360, 290)">
    <!-- Lightbulb Outer Halo -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="url(#ab-grad-primary)" stroke-width="1.5" opacity="0.45" stroke-dasharray="4 4" />

    <!-- Bulb Silhouette Base Glass Card -->
    <path d="M -36 -12 C -36 -58, 36 -58, 36 -12 C 36 16, 15 22, 15 50 L -15 50 C -15 22, -36 16, -36 -12 Z" fill="#0F172A" stroke="url(#ab-grad-primary)" stroke-width="2.5" />

    <!-- Inner Glow Gradient Fill -->
    <path d="M -32 -12 C -32 -52, 32 -52, 32 -12 C 32 14, 13 19, 13 46 L -13 46 C -13 19, -32 14, -32 -12 Z" fill="url(#ab-grad-bulb)" opacity="0.25" />

    <!-- Core Radiant Spot -->
    <circle cx="0" cy="-14" r="30" fill="url(#ab-core-glow)" />

    <!-- Creative Code / Pulse Filament -->
    <path d="M -12 2 L -4 -12 L 4 -2 L 12 -18" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
    <circle cx="12" cy="-18" r="3" fill="#38BDF8" />
    <circle cx="-12" cy="2" r="3" fill="#38BDF8" />

    <!-- Bulb Screw Base -->
    <rect x="-15" y="52" width="30" height="8" rx="3" fill="#1E293B" stroke="#2563EB" stroke-width="1.2" />
    <rect x="-11" y="62" width="22" height="7" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <path d="M -6 69 Q 0 74 6 69" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Radiant Rays -->
    <line x1="0" y1="-106" x2="0" y2="-86" stroke="url(#ab-grad-cyan)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-76" y1="-38" x2="-62" y2="-30" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" />
    <line x1="76" y1="-38" x2="62" y2="-30" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="-80" y1="16" x2="-64" y2="13" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" />
    <line x1="80" y1="16" x2="64" y2="13" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />
    <line x1="-54" y1="60" x2="-44" y2="50" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    <line x1="54" y1="60" x2="44" y2="50" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Constellation Nodes & Tech Sparks -->
  <circle cx="150" cy="410" r="4.5" fill="#38BDF8" />
  <circle cx="120" cy="150" r="3.5" fill="#2563EB" />
  <circle cx="580" cy="180" r="4" fill="#38BDF8" />
  <circle cx="590" cy="480" r="5" fill="#2563EB" />
  <circle cx="250" cy="480" r="3.5" fill="#60A5FA" />
  <circle cx="470" cy="130" r="3.5" fill="#38BDF8" />
  <circle cx="210" cy="120" r="2.5" fill="#93C5FD" />

  <!-- Subtle Diamond Accents -->
  <polygon points="530,220 534,224 530,228 526,224" fill="#38BDF8" opacity="0.8" />
  <polygon points="170,320 173,323 170,326 167,323" fill="#60A5FA" opacity="0.75" />
</svg>
