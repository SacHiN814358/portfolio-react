<svg width="100%" viewBox="60 40 560 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="wk-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="wk-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="wk-window-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="wk-preview-banner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="wk-card-item" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <radialGradient id="wk-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Electric-Blue Aura -->
  <circle cx="340" cy="285" r="230" fill="url(#wk-glow)" />

  <!-- Layer 1: Background Offset Card (Depth) -->
  <g transform="translate(230, 310)" opacity="0.4">
    <rect x="0" y="0" width="220" height="145" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="1.2" />
  </g>

  <!-- Layer 2: Mid Offset Card -->
  <g transform="translate(260, 275)" opacity="0.65">
    <rect x="0" y="0" width="220" height="145" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Layer 3: Foreground Main Browser Showcase Window -->
  <g transform="translate(285, 235)">
    <!-- Browser Window Container -->
    <rect x="0" y="0" width="225" height="155" rx="14" fill="url(#wk-window-dark)" stroke="url(#wk-grad-primary)" stroke-width="2" />

    <!-- Browser Window Header / Chrome -->
    <rect x="0" y="0" width="225" height="30" rx="14" fill="#1E293B" opacity="0.95" />
    <rect x="0" y="16" width="225" height="14" fill="#1E293B" opacity="0.95" />

    <!-- Window Control Dots (Electric-Blue Palette) -->
    <circle cx="16" cy="15" r="3.5" fill="#38BDF8" />
    <circle cx="28" cy="15" r="3.5" fill="#2563EB" />
    <circle cx="40" cy="15" r="3.5" fill="#475569" />

    <!-- Address / URL Bar -->
    <rect x="60" y="9" width="115" height="12" rx="6" fill="#0F172A" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <line x1="72" y1="15" x2="115" y2="15" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Showcase Website Banner inside Browser -->
    <rect x="18" y="42" width="190" height="34" rx="7" fill="url(#wk-preview-banner)" opacity="0.85" />
    <!-- Headline lines in banner -->
    <line x1="28" y1="54" x2="95" y2="54" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="64" x2="65" y2="64" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <rect x="155" y="49" width="42" height="20" rx="5" fill="#FFFFFF" opacity="0.9" />
    <path d="M 172 59 L 180 59 M 177 55 L 181 59 L 177 63" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Project UI Grid Cards (2 columns) -->
    <!-- Card 1 -->
    <rect x="18" y="86" width="90" height="52" rx="6" fill="url(#wk-card-item)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <rect x="24" y="92" width="78" height="22" rx="4" fill="#2563EB" opacity="0.35" />
    <line x1="24" y1="122" x2="65" y2="122" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="130" x2="80" y2="130" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />

    <!-- Card 2 -->
    <rect x="118" y="86" width="90" height="52" rx="6" fill="url(#wk-card-item)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <rect x="124" y="92" width="78" height="22" rx="4" fill="#38BDF8" opacity="0.25" />
    <line x1="124" y1="122" x2="165" y2="122" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" />
    <line x1="124" y1="130" x2="180" y2="130" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Left: Verified Showcase Badge / Code Seal -->
  <g transform="translate(160, 155)">
    <!-- Orbiting Accent Ring -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#wk-grad-cyan)" stroke-width="2" stroke-dasharray="5 5" opacity="0.6" />
    <!-- Seal Base -->
    <circle cx="0" cy="0" r="35" fill="url(#wk-grad-primary)" />
    <!-- Inner Dark Core -->
    <circle cx="0" cy="0" r="28" fill="#0F172A" />

    <!-- Code Verification Icon / Checkmark -->
    <path d="M -12 -1 L -3 8 L 14 -8" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Radiant Badge Accents -->
    <circle cx="0" cy="-35" r="2.5" fill="#38BDF8" />
    <circle cx="35" cy="0" r="2.5" fill="#38BDF8" />
    <circle cx="0" cy="35" r="2.5" fill="#38BDF8" />
    <circle cx="-35" cy="0" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Glowing Connector Data Stream (Seal -> Browser) -->
  <path d="M 195 180 C 230 210, 250 220, 285 250" fill="none" stroke="url(#wk-grad-cyan)" stroke-width="2" opacity="0.75" stroke-dasharray="3 6" stroke-linecap="round" />

  <!-- Constellation Nodes & Tech Particles -->
  <circle cx="540" cy="190" r="5" fill="#38BDF8" />
  <circle cx="560" cy="400" r="5.5" fill="#2563EB" />
  <circle cx="215" cy="460" r="4" fill="#60A5FA" />
  <circle cx="500" cy="360" r="3.5" fill="#38BDF8" />
  <circle cx="120" cy="230" r="3.5" fill="#2563EB" />
  <circle cx="140" cy="380" r="3" fill="#38BDF8" />
  <circle cx="490" cy="130" r="2.5" fill="#93C5FD" />

  <!-- Floating Responsive Device Outline (Left Bottom) -->
  <g transform="translate(100, 290)" opacity="0.75">
    <rect x="0" y="0" width="34" height="56" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="17" cy="48" r="2.5" fill="#38BDF8" />
    <line x1="8" y1="12" x2="26" y2="12" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round" />
    <rect x="8" y="18" width="18" height="20" rx="2" fill="#2563EB" opacity="0.4" />
  </g>

  <!-- Crosshair Accent -->
  <g transform="translate(480, 210)" stroke="#38BDF8" stroke-width="1.2" opacity="0.6">
    <line x1="-5" y1="0" x2="5" y2="0" />
    <line x1="0" y1="-5" x2="0" y2="5" />
  </g>
</svg>
