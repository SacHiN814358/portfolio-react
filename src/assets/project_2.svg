<svg width="419" height="280" viewBox="0 0 419 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p2BgGrad" x1="0" y1="0" x2="419" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>

    <!-- Electric Blue Accent Gradient -->
    <linearGradient id="p2Accent" x1="0" y1="0" x2="419" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Glow -->
    <radialGradient id="p2Glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="p2Banner" x1="0" y1="0" x2="190" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="p2Card" x1="0" y1="0" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Card Background Surface -->
  <rect width="419" height="280" rx="12" fill="url(#p2BgGrad)"/>
  <rect width="419" height="280" rx="12" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Ambient Glow -->
  <circle cx="340" cy="80" r="130" fill="url(#p2Glow)"/>

  <!-- Top App Navigation Bar -->
  <rect x="14" y="14" width="391" height="34" rx="8" fill="#131d31" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Logo / Brand Icon -->
  <rect x="22" y="21" width="20" height="20" rx="5" fill="url(#p2Accent)"/>
  <text x="32" y="35" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">⚡</text>
  
  <!-- Brand Text -->
  <text x="48" y="35" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Anand</text>
  <text x="86" y="35" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Sports</text>

  <!-- Search Input Pill -->
  <rect x="145" y="21" width="160" height="20" rx="10" fill="#0b1120" stroke="rgba(56, 189, 248, 0.25)"/>
  <circle cx="157" cy="31" r="3.5" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <line x1="160" y1="34" x2="163" y2="37" stroke="#64748b" stroke-width="1.2" stroke-linecap="round"/>
  <text x="170" y="34.5" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">Search cricket bats, jerseys, gear...</text>

  <!-- Cart Pill Badge -->
  <rect x="318" y="21" width="77" height="20" rx="5" fill="#1e293b" stroke="rgba(56, 189, 248, 0.3)"/>
  <text x="330" y="34" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">🛒</text>
  <text x="345" y="34" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600">Cart</text>
  <rect x="372" y="24" width="14" height="14" rx="7" fill="#2563eb"/>
  <text x="379" y="34.5" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">3</text>

  <!-- Main Body Content: Left Promo Banner (width: 185) -->
  <g transform="translate(14, 56)">
    <rect width="185" height="210" rx="8" fill="url(#p2Banner)"/>
    <rect width="185" height="210" rx="8" stroke="rgba(255, 255, 255, 0.12)"/>

    <!-- Subtle Pattern Lines -->
    <path d="M 0 40 Q 90 20 185 80 L 185 210 L 0 210 Z" fill="#0c1730" opacity="0.35"/>
    <circle cx="150" cy="40" r="50" fill="rgba(56, 189, 248, 0.15)"/>

    <!-- Category Tag -->
    <rect x="14" y="14" width="70" height="15" rx="3.5" fill="#0f172a" opacity="0.8"/>
    <text x="49" y="24.5" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">NEW SEASON '26</text>

    <!-- Headline -->
    <text x="14" y="52" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Pro Sports &amp;</text>
    <text x="14" y="70" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Athletic Gear</text>
    <text x="14" y="86" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">Next.js 14 E-Commerce Engine</text>

    <!-- Key Bullet Highlights -->
    <g transform="translate(14, 104)">
      <circle cx="4" cy="5" r="3" fill="#38bdf8"/>
      <text x="14" y="8" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500">Live Inventory &amp; Wholesaler Flow</text>

      <circle cx="4" cy="22" r="3" fill="#38bdf8"/>
      <text x="14" y="25" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500">Instant Cart State (Radix UI)</text>

      <circle cx="4" cy="39" r="3" fill="#38bdf8"/>
      <text x="14" y="42" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500">TypeScript &amp; Responsive UI</text>
    </g>

    <!-- Shop Now CTA Button -->
    <rect x="14" y="165" width="105" height="28" rx="6" fill="#2563eb" stroke="#60a5fa" stroke-width="0.8"/>
    <text x="56" y="182.5" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">EXPLORE STORE ↗</text>
  </g>

  <!-- Right Side: 2 Product Cards Grid -->
  <!-- Product Card 1 -->
  <g transform="translate(208, 56)">
    <rect width="197" height="100" rx="8" fill="url(#p2Card)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Thumbnail Image Container -->
    <rect x="10" y="10" width="70" height="80" rx="6" fill="#0b1120" stroke="rgba(56, 189, 248, 0.2)"/>
    <!-- Sport Graphic (Cricket Bat + Ball Icon) -->
    <circle cx="45" cy="50" r="18" fill="#1e293b"/>
    <text x="45" y="56" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">🏏</text>
    <!-- Badge -->
    <rect x="14" y="14" width="30" height="10" rx="2" fill="#1d4ed8"/>
    <text x="29" y="21.5" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="700" text-anchor="middle">TOP RATED</text>

    <!-- Product Info -->
    <text x="88" y="26" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">English Willow Bat</text>
    <text x="88" y="38" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5">Grade 1 • Pro Match Edition</text>
    
    <!-- Stars -->
    <text x="88" y="52" fill="#fbbf24" font-family="sans-serif" font-size="9">★★★★★</text>
    <text x="142" y="51" fill="#64748b" font-family="sans-serif" font-size="7">(48)</text>

    <!-- Price + Add Button -->
    <text x="88" y="74" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">₹8,499</text>
    <text x="135" y="73" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-decoration="line-through">₹11,999</text>
    <rect x="150" y="60" width="37" height="20" rx="4" fill="#2563eb"/>
    <text x="168.5" y="73" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">+ ADD</text>
  </g>

  <!-- Product Card 2 -->
  <g transform="translate(208, 166)">
    <rect width="197" height="100" rx="8" fill="url(#p2Card)" stroke="rgba(255, 255, 255, 0.08)"/>
    
    <!-- Thumbnail Image Container -->
    <rect x="10" y="10" width="70" height="80" rx="6" fill="#0b1120" stroke="rgba(56, 189, 248, 0.2)"/>
    <!-- Sport Graphic (Jersey / Apparel) -->
    <circle cx="45" cy="50" r="18" fill="#1e293b"/>
    <text x="45" y="56" fill="#38bdf8" font-family="sans-serif" font-size="16" text-anchor="middle">🎽</text>
    <!-- Badge -->
    <rect x="14" y="14" width="30" height="10" rx="2" fill="#059669"/>
    <text x="29" y="21.5" fill="#ffffff" font-family="sans-serif" font-size="6" font-weight="700" text-anchor="middle">IN STOCK</text>

    <!-- Product Info -->
    <text x="88" y="26" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Dry-Fit Training Kit</text>
    <text x="88" y="38" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5">Breathable Seamless Apparel</text>
    
    <!-- Stars -->
    <text x="88" y="52" fill="#fbbf24" font-family="sans-serif" font-size="9">★★★★★</text>
    <text x="142" y="51" fill="#64748b" font-family="sans-serif" font-size="7">(92)</text>

    <!-- Price + Add Button -->
    <text x="88" y="74" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">₹1,299</text>
    <text x="132" y="73" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" text-decoration="line-through">₹1,999</text>
    <rect x="150" y="60" width="37" height="20" rx="4" fill="#2563eb"/>
    <text x="168.5" y="73" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">+ ADD</text>
  </g>
</svg>
