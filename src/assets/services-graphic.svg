<svg width="100%" viewBox="60 60 560 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary Blue Gradients -->
    <linearGradient id="sv-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="sv-grad-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="sv-card-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="sv-button-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <radialGradient id="sv-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Electric-Blue Aura -->
  <circle cx="340" cy="285" r="230" fill="url(#sv-glow)" />

  <!-- Background Layer 1: Deep offset card -->
  <g transform="translate(210, 310)" opacity="0.4">
    <rect x="0" y="0" width="200" height="130" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="1.2" />
  </g>

  <!-- Background Layer 2: Mid offset card -->
  <g transform="translate(250, 275)" opacity="0.65">
    <rect x="0" y="0" width="200" height="130" rx="14" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Foreground Main Dashboard Window -->
  <g transform="translate(285, 235)">
    <!-- Container Card -->
    <rect x="0" y="0" width="210" height="145" rx="14" fill="url(#sv-card-dark)" stroke="url(#sv-grad-primary)" stroke-width="2" />

    <!-- Window Header -->
    <rect x="0" y="0" width="210" height="28" rx="14" fill="#1E293B" opacity="0.9" />
    <!-- Header bottom clip fix (straight edge below header bar) -->
    <rect x="0" y="14" width="210" height="14" fill="#1E293B" opacity="0.9" />

    <!-- Window Dots (Electric Blue Theme) -->
    <circle cx="16" cy="14" r="3.5" fill="#38BDF8" />
    <circle cx="28" cy="14" r="3.5" fill="#2563EB" />
    <circle cx="40" cy="14" r="3.5" fill="#475569" />

    <!-- Mini URL / Search Pill -->
    <rect x="58" y="8" width="105" height="12" rx="6" fill="#0F172A" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />

    <!-- Code / Data Lines inside Editor -->
    <line x1="20" y1="46" x2="135" y2="46" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    <line x1="20" y1="62" x2="95" y2="62" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="20" y1="76" x2="160" y2="76" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />

    <!-- Mini Chart / Service Metrics -->
    <g transform="translate(145, 96)">
      <!-- Mini bar columns -->
      <rect x="0" y="14" width="7" height="16" rx="2" fill="#1E40AF" />
      <rect x="11" y="8" width="7" height="22" rx="2" fill="#2563EB" />
      <rect x="22" y="2" width="7" height="28" rx="2" fill="#38BDF8" />
      <rect x="33" y="10" width="7" height="20" rx="2" fill="#60A5FA" />
    </g>

    <!-- Action Button / Service Toggle -->
    <rect x="20" y="98" width="65" height="28" rx="6" fill="url(#sv-button-grad)" opacity="0.95" />
    <rect x="94" y="98" width="40" height="28" rx="6" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Checkmark or icon in button -->
    <path d="M 45 112 L 50 117 L 60 107" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Left: Service Hub / API Node Engine -->
  <g transform="translate(150, 150)">
    <!-- Outer Gear / Pulse Ring -->
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#sv-grad-cyan)" stroke-width="2.5" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#2563EB" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="url(#sv-grad-primary)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />

    <!-- Service Radiating Rays / Node Antennas -->
    <line x1="0" y1="-56" x2="0" y2="-44" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="0" y1="44" x2="0" y2="56" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    <line x1="-56" y1="0" x2="-44" y2="0" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="44" y1="0" x2="56" y2="0" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
    <line x1="-38" y1="-38" x2="-30" y2="-30" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="30" x2="38" y2="38" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="-30" x2="38" y2="-38" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" />
    <line x1="-38" y1="38" x2="-30" y2="30" stroke="#2563EB" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Glowing Dotted Connector Stream: Node -> Dashboard -->
  <path d="M 180 190 C 220 220, 245 235, 285 260" fill="none" stroke="url(#sv-grad-cyan)" stroke-width="2" opacity="0.75" stroke-dasharray="3 6" stroke-linecap="round" />

  <!-- Data Spark Particles -->
  <circle cx="535" cy="205" r="4.5" fill="#38BDF8" />
  <circle cx="555" cy="395" r="5.5" fill="#2563EB" />
  <circle cx="190" cy="445" r="4" fill="#60A5FA" />
  <circle cx="495" cy="350" r="3.5" fill="#38BDF8" />
  <circle cx="230" cy="130" r="3.5" fill="#2563EB" />
  <circle cx="120" cy="340" r="3" fill="#38BDF8" />
  <circle cx="510" cy="140" r="2.5" fill="#93C5FD" />

  <!-- Tech Crosshair Highlights -->
  <g transform="translate(480, 210)" stroke="#38BDF8" stroke-width="1.2" opacity="0.6">
    <line x1="-6" y1="0" x2="6" y2="0" />
    <line x1="0" y1="-6" x2="0" y2="6" />
  </g>
</svg>
